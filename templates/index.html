<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinyl Catalog v3</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <h1>🎵 Vinyl Catalog <span class="v">v3</span></h1>
  <div class="meta" id="meta"></div>
</header>

<div class="layout">
  <main id="gallery" class="gallery">
    <div class="toolbar">
      <input id="search" placeholder="Search artist, title, label, catno…">
      <select id="filterStatus"><option value="">Any status</option>
        <option value="new">New</option>
        <option value="ai_done">AI done</option>
        <option value="discogs_done">Discogs done</option>
        <option value="both">Both</option></select>
      <select id="filterConfidence"><option value="">Any confidence</option>
        <option value="high">High</option><option value="low">Low</option><option value="unknown">Unknown</option></select>
      <label><input type="checkbox" id="filterHasAI"> Has AI</label>
      <label><input type="checkbox" id="filterHasDiscogs"> Has Discogs</label>
      <input id="yearFrom" type="number" placeholder="Year from" style="width:90px">
      <input id="yearTo" type="number" placeholder="Year to" style="width:90px">
      <input id="genre" placeholder="Genre">
      <input id="label" placeholder="Label">
      <select id="sort">
        <option value="updated_desc">Updated ↓</option>
        <option value="updated_asc">Updated ↑</option>
        <option value="artist_asc">Artist A→Z</option>
        <option value="artist_desc">Artist Z→A</option>
        <option value="title_asc">Title A→Z</option>
        <option value="year_desc">Year ↓</option>
      </select>
      <div class="views">
        <button data-view="list">List</button>
        <button data-view="tiles" class="active">Tiles</button>
        <button data-view="big">Big tiles</button>
      </div>
    </div>
    <div id="results" class="results"></div>
  </main>

  <aside class="sidebar">
    <button data-modal="import">📥 Import</button>
    <button data-modal="ai_settings">⚙️ AI Settings</button>
    <button data-modal="ai_enrich">🤖 Enrich with AI</button>
    <button data-modal="discogs_settings">💿 Discogs Settings</button>
    <button data-modal="discogs_enrich">🔍 Enrich with Discogs</button>
    <button data-modal="export">📤 Export</button>
    <button data-modal="backup">🗄️ Export Database</button>
  </aside>
</div>

<!-- Generic modal scaffolding -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="modal-close" type="button" aria-label="Close">×</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="modal-foot">
      <button id="modalDone" class="primary">Done / Close</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
